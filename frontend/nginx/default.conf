server_tokens off;

upstream api_backend {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Angular inyecta estilos de componentes con el nonce declarado en <app-root ngCspNonce>.
    # El marcador CSP_NONCE de index.html se reemplaza en cada respuesta por $request_id.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'CSP_NONCE' $request_id;

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre: inmutables.
    location ~* \.(?:js|css|woff2?|ico|png|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /health/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api_backend;
        # La API envía sus propias cabeceras de seguridad; se ocultan para no duplicarlas.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }
}
