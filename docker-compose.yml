name: plataforma-tiendas

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?Falta POSTGRES_SUPERUSER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Falta POSTGRES_SUPERUSER_PASSWORD en .env}
      APP_MIGRATOR_DB_PASSWORD: ${APP_MIGRATOR_DB_PASSWORD:?Falta APP_MIGRATOR_DB_PASSWORD en .env}
      APP_RUNTIME_DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD:?Falta APP_RUNTIME_DB_PASSWORD en .env}
      APP_PLATFORM_DB_PASSWORD: ${APP_PLATFORM_DB_PASSWORD:?Falta APP_PLATFORM_DB_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    <<: *hardening
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    <<: *hardening
    environment:
      APP_ENV: ${APP_ENV:-demo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: app_runtime
      DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD}
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    <<: *hardening
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PANEL_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    <<: *hardening
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      APP_MIGRATOR_DB_PASSWORD: ${APP_MIGRATOR_DB_PASSWORD}
      APP_RUNTIME_DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD}
      APP_PLATFORM_DB_PASSWORD: ${APP_PLATFORM_DB_PASSWORD}
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
